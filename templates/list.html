<head>
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='styles.css') }}"
  />
</head>
<div class="container">
  <div class="inner">
    <a href="/add" class="btn">+ Add Product</a>

    <h2>All Products</h2>

    {% if products %}
    <div class="product-grid">
      {% for p in products %}
      <div class="product-card">
        <img src="../static/images/{{ p.image }}" alt="{{ p.name }}" />
        <div class="product-info">
          <h3>{{ p.name }}</h3>
          <div class="price">${{ p.price }}</div>
          <a href="/product/{{ p.id }}" class="btn btn-small"> View Details </a>
        </div>
      </div>
      {% endfor %}
    </div>
    {% else %}
    <p>No products yet.</p>
    {% endif %}
  </div>
</div>
